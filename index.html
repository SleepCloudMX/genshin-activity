<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="原神限时活动的支持率、倍率与下注策略观察">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/SleepCloudMX/SleepCloudMX.github.io/main/Others/Image/kenomimi.png">
  <title>活动观测</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('activity-analysis-theme') || 'light';
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="web/style.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back-link hidden" id="back-btn" type="button">← 所有活动</button>
      </div>
      <div class="topbar-actions">
        <a class="icon-btn" href="https://github.com/SleepCloudMX/genshin-activity" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.35.78 1.05.78 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
          </svg>
        </a>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="切换到暗色模式" title="切换到暗色模式">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
      <section id="index-view">
        <header class="index-hero">
          <div class="eyebrow">原神 · 限时活动</div>
          <h1 class="index-title">活动观测</h1>
        </header>

        <div class="index-list-head">
          <h2>活动</h2>
          <span id="index-caption"></span>
        </div>
        <div id="activity-cards" class="activity-list"></div>
      </section>

      <section id="dashboard-view" class="hidden">
        <header class="activity-head">
          <div class="eyebrow" id="hero-eyebrow"></div>
          <h1 class="activity-title" id="hero-title"></h1>
          <div class="activity-meta">
            <span id="activity-meta-main"></span>
            <span id="activity-meta-updated"></span>
          </div>
        </header>

        <div class="loading" id="loading">正在载入…</div>
        <div class="notice hidden" id="error-panel" role="alert"></div>
        <div class="notice warn hidden" id="warning-panel" role="status"></div>

        <section class="section" id="section-overview">
          <div class="section-head">
            <h2>概览</h2>
            <p class="section-caption" id="overview-caption"></p>
          </div>
          <div class="kpi-grid" id="kpis"></div>
          <p class="reward-note" id="reward-note"></p>
          <div class="panel insights-panel">
            <h3 class="panel-title">要点</h3>
            <div id="insights" class="insights"></div>
          </div>
        </section>

        <section class="section" id="section-god">
          <div class="section-head">
            <h2>上帝视角</h2>
            <p class="section-caption">理论上界：假设提前知道胜负，并可以攒券集中下注。</p>
          </div>
          <div class="panel table-panel">
            <div class="panel-title">上界计划</div>
            <div class="table-wrap" id="god-plan-table"></div>
            <div class="prefix-strip" id="god-prefixes"></div>
          </div>
          <div class="panel chart-panel table-panel">
            <div class="panel-title">每日得分</div>
            <div class="chart tall" id="god-chart" role="img" aria-label="上帝视角每日得分与累计"></div>
          </div>
        </section>

        <section class="section" id="section-strategy">
          <div class="section-head">
            <h2>策略回测</h2>
            <p class="section-caption">以下策略按<strong>每场 50 券</strong>评估，固定选边。</p>
          </div>
          <div class="grid-2">
            <div class="panel chart-panel">
              <div class="panel-title">累计得分</div>
              <div class="chart tall" id="strategy-cum-chart" role="img" aria-label="各固定策略累计得分曲线"></div>
            </div>
            <div class="panel chart-panel">
              <div class="panel-title">得分构成</div>
              <div class="chart tall" id="strategy-final-chart" role="img" aria-label="各固定策略得分构成"></div>
            </div>
          </div>
          <div class="panel table-panel">
            <div class="panel-title">策略汇总</div>
            <div class="table-wrap" id="strategy-table"></div>
          </div>
        </section>

        <section class="section" id="section-random">
          <div class="section-head">
            <h2>随机策略</h2>
            <p class="section-caption">每场 <strong>50 券</strong>，结果固定，只让选边随机。</p>
          </div>
          <div class="grid-2">
            <div class="panel chart-panel">
              <div class="panel-title">最终得分分布</div>
              <div class="chart tall" id="hist-chart" role="img" aria-label="随机策略最终得分直方图"></div>
            </div>
            <div class="panel chart-panel">
              <div class="panel-title">达到概率</div>
              <div class="chart tall" id="cdf-chart" role="img" aria-label="随机策略达到概率曲线"></div>
            </div>
          </div>
          <div class="panel chart-panel">
            <div class="panel-title">逐日累计 · 阴影为 20%–80% 分位</div>
            <div class="chart tall" id="daily-band-chart" role="img" aria-label="随机策略逐日累计分位带"></div>
          </div>
          <div class="panel table-panel">
            <div class="panel-title">随机策略统计 · 每场 50 券</div>
            <div class="table-wrap responsive" id="random-table"></div>
          </div>
        </section>

        <section class="section" id="section-odds">
          <div class="section-head">
            <h2>支持率与倍率</h2>
            <p class="section-caption">支持率越低，赔率越高；不涉及队伍强弱。</p>
          </div>
          <div class="grid-2">
            <div class="panel chart-panel">
              <div class="panel-title">赔率观测</div>
              <div class="chart tall" id="odds-chart" role="img" aria-label="支持率与赔率散点图"></div>
            </div>
            <div class="panel chart-panel">
              <div class="panel-title">热门方胜率</div>
              <div class="chart tall" id="favorite-chart" role="img" aria-label="热门方胜率按支持率分档"></div>
            </div>
          </div>
          <div class="panel table-panel">
            <div class="panel-title">支持率分档</div>
            <div class="table-wrap" id="bucket-table"></div>
          </div>
        </section>

        <section class="section" id="section-data">
          <div class="section-head">
            <h2>数据</h2>
            <p class="section-caption" id="data-caption"></p>
          </div>
          <div class="panel table-panel">
            <div class="table-wrap" id="match-table"></div>
          </div>
          <div class="method-block">
            <h3>方法与口径</h3>
            <div class="method-grid">
              <div id="method-notes"></div>
              <div id="caveats"></div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <noscript>
    <div class="notice">本页面需要启用 JavaScript 才能查看活动和图表。</div>
  </noscript>

  <script src="data/activities.js"></script>
  <script src="web/app.js"></script>
</body>
</html>
